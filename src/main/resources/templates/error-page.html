<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error-box { border: 2px solid red; padding: 20px; display: inline-block; background: #ffeeee; }
    </style>
</head>
<body>
<div class="error-box">
    <h1>Помилка <span th:text="${status}">500</span></h1>
    <p th:text="${message}">Щось пішло не так...</p>
    <a href="/fish/">Повернутися на головну</a>
</div>
</body>
</html>
